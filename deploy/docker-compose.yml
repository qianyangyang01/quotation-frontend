name: quotation-prod

x-quotation-logging: &quotation-logging
  driver: local
  options: { max-size: "20m", max-file: "10" }

services:
  quotation-postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotation_prod
      POSTGRES_USER: quotation_app
      POSTGRES_PASSWORD: ${QUOTATION_POSTGRES_PASSWORD:?required}
      TZ: UTC
    volumes:
      - quotation-postgres-data:/var/lib/postgresql/data
    networks: [quotation-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation_app -d quotation_prod"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *quotation-logging

  quotation-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${QUOTATION_REDIS_PASSWORD:?required}"]
    volumes:
      - quotation-redis-data:/data
    networks: [quotation-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${QUOTATION_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *quotation-logging

  quotation-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${QUOTATION_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${QUOTATION_MINIO_SECRET_KEY:?required}
    volumes:
      - quotation-minio-data:/data
    networks: [quotation-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *quotation-logging

  quotation-backend:
    image: quotation-backend:${QUOTATION_RELEASE:?required}
    restart: unless-stopped
    depends_on:
      quotation-postgres: { condition: service_healthy }
      quotation-redis: { condition: service_healthy }
      quotation-minio: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://quotation-postgres:5432/quotation_prod
      SPRING_DATASOURCE_USERNAME: quotation_app
      SPRING_DATASOURCE_PASSWORD: ${QUOTATION_POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: quotation-redis
      SPRING_DATA_REDIS_PASSWORD: ${QUOTATION_REDIS_PASSWORD}
      APP_STORAGE_ENDPOINT: http://quotation-minio:9000
      APP_STORAGE_ACCESS_KEY: ${QUOTATION_MINIO_ACCESS_KEY}
      APP_STORAGE_SECRET_KEY: ${QUOTATION_MINIO_SECRET_KEY}
      APP_STORAGE_BUCKET: quotation-assets
      APP_BOOTSTRAP_ADMIN_ACCOUNT: ${QUOTATION_BOOTSTRAP_ADMIN_ACCOUNT}
      APP_BOOTSTRAP_ADMIN_NAME: ${QUOTATION_BOOTSTRAP_ADMIN_NAME}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${QUOTATION_BOOTSTRAP_ADMIN_PASSWORD}
      APP_PUBLIC_BASE_URL: ${QUOTATION_PUBLIC_BASE_URL}
      APP_CORS_ALLOWED_ORIGIN: ${QUOTATION_PUBLIC_BASE_URL}
      APP_COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Duser.timezone=UTC
    expose: ["8088"]
    networks: [quotation-internal, ahmln-edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    logging: *quotation-logging

  quotation-frontend:
    image: quotation-frontend:${QUOTATION_RELEASE:?required}
    restart: unless-stopped
    depends_on:
      quotation-backend: { condition: service_healthy }
    expose: ["80"]
    networks: [ahmln-edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    logging: *quotation-logging

networks:
  quotation-internal:
    name: quotation-internal
    internal: true
  ahmln-edge:
    name: ahmln-edge
    external: true

volumes:
  quotation-postgres-data: { name: quotation-postgres-data }
  quotation-redis-data: { name: quotation-redis-data }
  quotation-minio-data: { name: quotation-minio-data }
