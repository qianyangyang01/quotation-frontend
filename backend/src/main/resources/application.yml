server:
  port: 8088
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json
  servlet:
    session:
      cookie:
        name: QUOTATION_SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: milano-quotation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quotation_prod}
    username: ${SPRING_DATASOURCE_USERNAME:quotation_app}
    password: ${SPRING_DATASOURCE_PASSWORD:quotation_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      repositories:
        enabled: false
  session:
    store-type: redis
    redis:
      namespace: quotation:session
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:512MB}
      max-request-size: ${APP_MAX_REQUEST_SIZE:520MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:https://vip.ahmln.com}
  bootstrap-admin:
    account: ${APP_BOOTSTRAP_ADMIN_ACCOUNT:admin}
    name: ${APP_BOOTSTRAP_ADMIN_NAME:系统管理员}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    initialize: ${APP_STORAGE_INITIALIZE:true}
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:quotation_dev}
    secret-key: ${APP_STORAGE_SECRET_KEY:quotation_dev_secret}
    bucket: ${APP_STORAGE_BUCKET:quotation-assets}
  cors-allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://127.0.0.1:5173}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
