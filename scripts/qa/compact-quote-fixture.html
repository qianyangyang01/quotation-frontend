<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>简版报价图文 · 本地预览</title>
<style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f4f6f8;color:#202532}header{padding:20px 28px;background:#fff;border-bottom:3px solid #ff8120}h1{font-size:22px;margin:0 0 8px}header p{margin:0;color:#765327}main{margin:24px;background:white;padding:20px;border:1px solid #dde2e8;border-radius:12px}h2{font-size:17px}.record-copy-actions{padding:12px 0}</style>
<header><h1>图文表格 · 本地预览</h1><p>隔离示例，不用于业务。点击“复制图文表格”，可将可编辑单元格和商品图片粘贴到 WPS。相同 SKU 与图片合并显示，合并物流保留来源及比例。</p></header><main id="app"></main>
<script type="module">
import {createApp,h} from 'vue'
import Sheet from '/src/components/quotation/CustomerQuoteSheet.vue'
import Actions from '/src/components/quotation/QuotationRecordCopyActions.vue'
import ListCopy from '/src/components/quotation/QuotationRecordTableCopy.vue'
import {normalizeQuotationRecord} from '/src/data/quotationRecords.ts'
import {quotationRecordQuoteSheetSource} from '/src/data/quotationRecordQuoteSheet.ts'
import {authState} from '/src/data/authStore.ts'
const nativeFetch=window.fetch.bind(window)
window.fetch=(input,options)=>{
  const url=typeof input==='string'?input:input.url
  if(url==='/api/v1/assets/11111111-1111-4111-8111-111111111111')return nativeFetch('/outputs/compact-quote/sample.png',options)
  if(url==='/api/v1/quotations/compact-local')return Promise.resolve(new Response(JSON.stringify({data:window.localRecord}),{headers:{'Content-Type':'application/json'}}))
  if(url.includes('/api/'))throw new Error('本地示例禁止访问业务接口')
  return nativeFetch(input,options)
}
authState.current={id:'local-compact-preview',name:'本地验收',account:'LOCALQA',role:'super_admin',status:'enabled',mustChangePassword:false,passwordUpdatedAt:''}
authState.permissions=['quote','purchase','logistics','finance'];authState.initialized=true
const countries=['US','US','GB','CA','AU','AU']
const carriers=['顺丰','燕文','顺丰','云途','顺丰','顺丰']
const prices=[[13.4,23.15,33.6],[13.45,23.7,34],[11.15,18.85,26.75],[11.9,21.15,31.75],[12.3,19.65,27],[15.8,25.35,35.55]]
const record=normalizeQuotationRecord({id:'compact-local',no:'LOCAL-ONLY',primarySku:'BK2603011',customerName:'本地示例，不用于业务',salespersonName:'本地验收',quoteMode:'single',
  quoteOptions:prices.map((p,i)=>({id:'option-'+i,country:countries[i],countryCode:countries[i],carrier:carriers[i],channel:i===0?'顺丰商派':carriers[i],rule:'示例',eta:'7-12 days',quote1Usd:p[0],quote2Usd:p[1],quote3Usd:p[2]})),
  customerQuote:{quantities:[1,2,3],rows:prices.map((p,i)=>({optionId:'option-'+i,prices:p})),showPhotos:true,photos:[{assetId:'11111111-1111-4111-8111-111111111111',name:'sample.png'}],sizeRules:'S / M / L',sizeRulesEnabled:true,
  averagePlans:[{id:'combined-local',mode:'weighted',display:'details',provider:'Combined Shipping',shippingTime:'7-12 days',quantities:[1,2,3],members:[{optionId:'option-0',weight:50,sourcePrices:prices[0]},{optionId:'option-1',weight:50,sourcePrices:prices[1]}],systemPrices:[13.43,23.43,33.8],prices:[14.33,25.18,36.55]}]}})
window.localRecord=record
createApp({render:()=>h('div',[
  h('h2','报价记录列表入口'),h('section',{style:'display:flex;gap:32px;align-items:center;padding:18px;border:1px solid #dde2e8;border-radius:8px;margin-bottom:28px'},[h('strong','LOCAL-ONLY · BK2603011'),h('span','7 行示例报价 · 已保存'),h(ListCopy,{record})]),
  h('h2','报价单入口'),h(Sheet,{...quotationRecordQuoteSheetSource(record),contextKey:'local-sheet',sourcePending:false}),
  h('h2','报价记录入口（同一份已保存示例，复制不修改记录）'),h(Actions,{record})
])}).mount('#app')
</script></html>
